service: restaurant-ai-service

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}

functions:
  analyzeInventory:
    handler: dist/handler.analyzeInventory
    timeout: 30
    events:
      - http:
          path: /ai/analyze
          method: post
          cors: true

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 8004
    host: 0.0.0.0
    noPrependStageInUrl: true
