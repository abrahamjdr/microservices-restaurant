service: restaurant-ai-service

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}

functions:
  recommend:
    handler: dist/handler.recommend
    events:
      - http:
          path: /ai/recommend
          method: post
          cors: true

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 8004
    host: 0.0.0.0
