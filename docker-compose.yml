networks:
  restaurant-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-postgres
    networks:
      - restaurant-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_pass}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-restaurant_user} -d ${POSTGRES_DB:-restaurant}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    container_name: restaurant-redis
    networks:
      - restaurant-net
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  kitchen-service:
    build:
      context: .
      dockerfile: services/kitchen-service/Dockerfile
    container_name: restaurant-kitchen
    networks:
      - restaurant-net
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8001
      KITCHEN_DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD:-restaurant_pass}@postgres:5432/${POSTGRES_DB:-restaurant}?schema=kitchen
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

  warehouse-service:
    build:
      context: .
      dockerfile: services/warehouse-service/Dockerfile
    container_name: restaurant-warehouse
    networks:
      - restaurant-net
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8002
      WAREHOUSE_DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD:-restaurant_pass}@postgres:5432/${POSTGRES_DB:-restaurant}?schema=warehouse
      MARKET_SERVICE_URL: http://market-service:8003
      AI_SERVICE_URL: http://ai-service:8004
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8002/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

  market-service:
    build:
      context: .
      dockerfile: services/market-service/Dockerfile
    container_name: restaurant-market
    networks:
      - restaurant-net
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8003
      MARKET_DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD:-restaurant_pass}@postgres:5432/${POSTGRES_DB:-restaurant}?schema=market
      FARMERS_MARKET_API_URL: ${FARMERS_MARKET_API_URL:-https://recruitment.alegra.com/api/farmers-market/buy}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8003/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

  bull-board:
    image: node:20-alpine
    container_name: restaurant-bull-board
    working_dir: /app
    networks:
      - restaurant-net
    ports:
      - '3001:3001'
    volumes:
      - ./services/bull-board:/app
    command: sh -c "npm install && npm start"
    depends_on:
      redis:
        condition: service_healthy

  ai-service:
    working_dir: /app
    image: node:20-alpine
    container_name: restaurant-ai
    networks:
      - restaurant-net
    volumes:
      - ./services/ai-service:/app
    command: sh -c "npm install && npm run build && npx serverless offline"
    ports:
      - '8004:8004'
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      # OPENAI_API_KEY se carga exclusivamente desde env_file (.env)
      # No se declara aquí para evitar que docker-compose lo sobreescriba
      # con una cadena vacía cuando la variable no está exportada en el shell.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "wget -qO- http://localhost:8004/health || wget -qO- http://localhost:8004/ai/analyze --post-data '{}' || exit 0",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: restaurant-gateway
    networks:
      - restaurant-net
    ports:
      - '8000:8000'
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8000
      KITCHEN_SERVICE_URL: http://kitchen-service:8001
      WAREHOUSE_SERVICE_URL: http://warehouse-service:8002
      MARKET_SERVICE_URL: http://market-service:8003
    depends_on:
      kitchen-service:
        condition: service_healthy
      warehouse-service:
        condition: service_healthy
      market-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
    container_name: restaurant-frontend
    networks:
      - restaurant-net
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
