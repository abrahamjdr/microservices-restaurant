version: '3.9'

networks:
  restaurant-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-postgres
    networks:
      - restaurant-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_pass}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurant_user} -d ${POSTGRES_DB:-restaurant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  kitchen-service:
    build:
      context: ./services/kitchen-service
      dockerfile: Dockerfile
    container_name: restaurant-kitchen
    networks:
      - restaurant-net
    environment:
      NODE_ENV: production
      PORT: 8001
      KITCHEN_DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD:-restaurant_pass}@postgres:5432/${POSTGRES_DB:-restaurant}?schema=kitchen
      WAREHOUSE_SERVICE_URL: http://warehouse-service:8002
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  warehouse-service:
    build:
      context: ./services/warehouse-service
      dockerfile: Dockerfile
    container_name: restaurant-warehouse
    networks:
      - restaurant-net
    environment:
      NODE_ENV: production
      PORT: 8002
      WAREHOUSE_DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD:-restaurant_pass}@postgres:5432/${POSTGRES_DB:-restaurant}?schema=warehouse
      MARKET_SERVICE_URL: http://market-service:8003
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  market-service:
    build:
      context: ./services/market-service
      dockerfile: Dockerfile
    container_name: restaurant-market
    networks:
      - restaurant-net
    environment:
      NODE_ENV: production
      PORT: 8003
      MARKET_DATABASE_URL: postgresql://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD:-restaurant_pass}@postgres:5432/${POSTGRES_DB:-restaurant}?schema=market
      FARMERS_MARKET_API_URL: ${FARMERS_MARKET_API_URL:-https://recruitment.alegra.com/api/farmers-market/buy}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  ai-service:
    working_dir: /app
    image: node:20-alpine
    container_name: restaurant-ai
    networks:
      - restaurant-net
    volumes:
      - ./services/ai-service:/app
    command: sh -c "npm install && npm run build && npx serverless offline --host 0.0.0.0 --port 8004"
    ports:
      - "8004:8004"
    environment:
      NODE_ENV: development
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: restaurant-gateway
    networks:
      - restaurant-net
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      KITCHEN_SERVICE_URL: http://kitchen-service:8001
      WAREHOUSE_SERVICE_URL: http://warehouse-service:8002
      MARKET_SERVICE_URL: http://market-service:8003
      AI_SERVICE_URL: http://ai-service:8004
    depends_on:
      kitchen-service:
        condition: service_healthy
      warehouse-service:
        condition: service_healthy
      market-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: restaurant-frontend
    networks:
      - restaurant-net
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api-gateway

volumes:
  postgres_data:
